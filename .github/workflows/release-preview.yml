name: Build release from current source
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'release.json'
      - '.github/workflows/release-preview.yml'
      - 'android/**'
      - 'desktop/**'
      - 'server/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
concurrency:
  group: relaydeck-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'android-sdk'
          $archive = Join-Path $env:RUNNER_TEMP 'commandlinetools.zip'
          New-Item -ItemType Directory -Path $sdk -Force | Out-Null
          Invoke-WebRequest 'https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'commandlinetools') -Force
          $bin = Join-Path $env:RUNNER_TEMP 'commandlinetools/cmdline-tools/bin'
          $env:ANDROID_SDK_ROOT = $sdk
          & (Join-Path $bin 'sdkmanager.bat') --sdk_root=$sdk --licenses | Out-Null
          & (Join-Path $bin 'sdkmanager.bat') --sdk_root=$sdk 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
      - name: Install dependencies and verify release metadata
        shell: pwsh
        run: |
          npm ci
          npm run verify:release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test Node and desktop code
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build desktop plugin
        shell: pwsh
        run: ./scripts/build-desktop-plugin.ps1
      - name: Build and test Android from this commit
        shell: pwsh
        run: |
          ./scripts/build-android.ps1 -SdkPath $env:ANDROID_SDK_ROOT -JavaPath $env:JAVA_HOME -GradlePath (Join-Path $PWD 'android/gradlew.bat') -UpdateRepo $env:GITHUB_REPOSITORY
      - name: Check package privacy and collect release metadata
        shell: pwsh
        run: |
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          $version = $release.version
          $desktop = ".local/releases/relaydeck-desktop-$version.zip"
          $apk = ".local/releases/relaydeck-$version.apk"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($file in @($desktop, $apk)) {
            $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $file))
            try {
              $bad = @($zip.Entries | Where-Object { $_.FullName -match '(?i)(\.local/|\.local\.(json|md)|shared_prefs/|databases/|\.(keystore|pfx|pem|key|crt)$|Packet\.dll$)' })
              if ($bad.Count) { throw "Unexpected private file or excluded dependency in $file" }
            } finally { $zip.Dispose() }
          }
          "RELAYDECK_VERSION=$version" >> $env:GITHUB_ENV
          "RELAYDECK_TAG=v$version" >> $env:GITHUB_ENV
      - name: Publish both installation packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = "docs/release-$env:RELAYDECK_VERSION.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release view $env:RELAYDECK_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $arguments = @('release','create',$env:RELAYDECK_TAG,'--target',$env:GITHUB_SHA,'--title',"RelayDeck $env:RELAYDECK_VERSION",'--notes-file',$notes)
            if ($env:RELAYDECK_VERSION.Contains('-')) { $arguments += '--prerelease' }
            gh @arguments
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELAYDECK_TAG ".local/releases/relaydeck-desktop-$env:RELAYDECK_VERSION.zip" ".local/releases/relaydeck-$env:RELAYDECK_VERSION.apk" --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RELAYDECK_RELEASE_TAG = $env:RELAYDECK_TAG
          node scripts/update-release-notes.mjs
          exit $LASTEXITCODE


